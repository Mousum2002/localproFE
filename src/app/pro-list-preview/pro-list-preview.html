<div class="w3-container">
  <div class="w3-bar w3-light-grey w3-padding w3-margin-bottom">
    <label class="w3-margin-right"><b>Filtra per tipologia:</b></label>
    <select class="w3-select w3-border" style="width: auto; display: inline-block;"
      [(ngModel)]="selectedTypeId"
      (ngModelChange)="filterByType()">
      <option value="">Tutti gli utenti</option>
      @for (type of operationTypes(); track type.id) {
        <option [value]="type.id">{{ type.name }}</option>
      }
    </select>
    <span class="w3-margin-left w3-text-grey">
      {{ filteredUsers().length }} utenti trovati
    </span>
  </div>

  <div class="prolist">
    @for (user of filteredUsers(); track user.id) {
      <app-pro-card
        [portalUser]="user"
        [isAdmin]="isAdmin"
        (onBan)="banUser($event)"
        (onUnban)="unbanUser($event)"
        (onDelete)="deleteUser($event)"
      />
    }
    @if (filteredUsers().length === 0) {
      <p class="w3-center w3-text-grey">Nessun utente trovato.</p>
    }
  </div>
</div>
