<div class="list-wrapper">

  <div class="list-header">
    <h1 class="list-title">Professionisti</h1>
    <p class="list-subtitle">Trova il professionista giusto per le tue esigenze</p>
  </div>

  <div class="filter-bar">
    <div class="filter-left">
      <span class="filter-icon">⚙</span>
      <select class="filter-select"
        [(ngModel)]="selectedTypeId"
        (ngModelChange)="filterByType()">
        <option value="">Tutti gli utenti</option>
        @for (type of operationTypes(); track type.id) {
          <option [value]="type.id">{{ type.name }}</option>
        }
      </select>
    </div>
    <span class="filter-count">{{ filteredUsers().length }} risultati</span>
  </div>

  <div class="prolist">
    @for (user of filteredUsers(); track user.id) {
      <app-pro-card
        [portalUser]="user"
        [isAdmin]="isAdmin"
        (onBan)="banUser($event)"
        (onUnban)="unbanUser($event)"
        (onDelete)="deleteUser($event)"
      />
    }
    @if (filteredUsers().length === 0) {
      <p class="empty-msg">Nessun utente trovato.</p>
    }
  </div>

</div>
