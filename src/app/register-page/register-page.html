<div class="register-wrapper">
  <div class="register-card">

    <div class="login-brand">
      <span class="brand-dot"></span>
      <span class="brand-name">LocalPro</span>
    </div>

    <h1 class="register-title">Crea il tuo account</h1>
    <p class="register-sub">Unisciti alla community di professionisti locali</p>

    <!-- Messaggio di successo -->
    <div *ngIf="success(); else registrationForm" class="success-msg">
      ✓ Registrazione completata! Reindirizzamento al login...
    </div>

    <!-- Form di registrazione -->
    <ng-template #registrationForm>
      <div class="section-label">Dati obbligatori</div>

      <div class="form-group">
        <label class="form-label">Username *</label>
        <input class="form-input" type="text" placeholder="scegli un username"
               [(ngModel)]="userName" />
      </div>

      <div class="form-group">
        <label class="form-label">Email *</label>
        <input class="form-input" type="email" placeholder="tua@email.com"
               [(ngModel)]="email" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Password *</label>
          <input class="form-input" type="password" placeholder="min. 8 caratteri"
                 [(ngModel)]="password" />
        </div>
        <div class="form-group">
          <label class="form-label">Conferma password *</label>
          <input class="form-input" type="password" placeholder="ripeti la password"
                 [(ngModel)]="confirmPassword" />
        </div>
      </div>

      <div class="section-label">Dati opzionali</div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Città</label>
          <input class="form-input" type="text" placeholder="es. Roma"
                 [(ngModel)]="city" />
        </div>
        <div class="form-group">
          <label class="form-label">Indirizzo</label>
          <input class="form-input" type="text" placeholder="es. Via Roma 1"
                 [(ngModel)]="address" />
        </div>
      </div>

      <!-- Messaggio di errore -->
      <div *ngIf="error()" class="error-msg">{{ error() }}</div>

      <!-- Bottone di registrazione -->
      <button class="btn-register" (click)="register()" [disabled]="loading()">
        <span *ngIf="loading(); else btnText">Registrazione in corso...</span>
        <ng-template #btnText>Crea account</ng-template>
      </button>

      <p class="login-link">
        Hai già un account? <a routerLink="/login">Accedi</a>
      </p>
    </ng-template>

  </div>
</div>
